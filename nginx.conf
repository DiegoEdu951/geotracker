# /etc/nginx/sites-available/geotracker
#
# Pasos para activar:
#   sudo cp este-archivo /etc/nginx/sites-available/geotracker
#   sudo ln -s /etc/nginx/sites-available/geotracker /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx

server {
    listen 80;
    server_name TU_IP_O_DOMINIO;   # ← cambia esto por tu IP o dominio

    # Redirige todo a HTTPS (activa después de tener certificado)
    # return 301 https://$host$request_uri;

    # ── Archivos estáticos del panel web ──
    root /var/www/geotracker/public;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # ── Proxy hacia la API Node.js ──
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

