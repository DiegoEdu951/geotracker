<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoTracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Courier New', monospace;
      background: #0a0a0f;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 20px;
      background: #0f0f1a;
      border-bottom: 1px solid #1e2a3a;
      z-index: 1000;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 14px;
      font-weight: normal;
      letter-spacing: 0.15em;
      color: #4af;
      text-transform: uppercase;
    }

    .mode-tabs {
      display: flex;
      gap: 4px;
      margin-left: 20px;
    }

    .tab-btn {
      padding: 5px 14px;
      font-size: 11px;
      font-family: 'Courier New', monospace;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: 1px solid #1e2a3a;
      background: transparent;
      color: #556;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn:hover { border-color: #2a4060; color: #8ab; }
    .tab-btn.active { border-color: #4af; color: #4af; background: #0d1a2a; }

    #status {
      font-size: 11px;
      color: #556;
      margin-left: auto;
    }

    #status.live::before {
      content: '● ';
      color: #4f8;
      animation: blink 1.5s infinite;
    }

    @keyframes blink { 50% { opacity: 0.3; } }

    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    #sidebar {
      width: 270px;
      background: #0f0f1a;
      border-right: 1px solid #1e2a3a;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    .sidebar-section {
      font-size: 10px;
      letter-spacing: 0.2em;
      color: #445;
      text-transform: uppercase;
      padding: 12px 16px 8px;
      border-bottom: 1px solid #1a2030;
    }

    #device-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    #history-panel {
      border-top: 1px solid #1e2a3a;
      background: #0c0c16;
      display: none;
      flex-direction: column;
      max-height: 50%;
    }

    #history-panel.visible { display: flex; }

    .history-form {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-form label {
      font-size: 10px;
      color: #445;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      display: block;
      margin-bottom: 3px;
    }

    .history-form select,
    .history-form input[type="datetime-local"] {
      width: 100%;
      background: #111120;
      border: 1px solid #1e2a3a;
      color: #ccd;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      padding: 5px 8px;
      border-radius: 4px;
      outline: none;
    }

    .history-form select:focus,
    .history-form input:focus { border-color: #2a4060; }

    .history-form input[type="datetime-local"]::-webkit-calendar-picker-indicator {
      filter: invert(0.5);
      cursor: pointer;
    }

    .btn-search {
      padding: 7px 0;
      background: #0d1a2a;
      border: 1px solid #4af;
      color: #4af;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-search:hover { background: #122030; }

    .btn-clear {
      padding: 6px 0;
      background: transparent;
      border: 1px solid #1e2a3a;
      color: #445;
      font-family: 'Courier New', monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-clear:hover { border-color: #f64; color: #f64; }

    #history-results {
      overflow-y: auto;
      flex: 1;
      padding: 0 12px 8px;
    }

    .history-stat {
      font-size: 10px;
      color: #556;
      padding: 6px 0;
      border-bottom: 1px solid #1a2030;
      margin-bottom: 6px;
    }

    .history-stat span { color: #4af; }

    .history-point {
      font-size: 10px;
      color: #445;
      padding: 4px 0;
      border-bottom: 1px solid #12121e;
      cursor: pointer;
      transition: color 0.15s;
      line-height: 1.5;
    }

    .history-point:hover { color: #8ab; }
    .history-point .h-time { color: #6a9; }
    .history-point .h-coord { color: #556; }

    #map {
      flex: 1;
      background: #0a0a0f;
    }

    .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.85) saturate(0.9); }
    .leaflet-marker-icon { filter: none; }

    .leaflet-popup-content-wrapper {
      background: #0f0f1a;
      border: 1px solid #2a4060;
      border-radius: 6px;
      color: #ccd;
      font-family: 'Courier New', monospace;
      font-size: 12px;
    }

    .leaflet-popup-tip { background: #0f0f1a; }
    .popup-title { font-size: 13px; color: #4af; margin-bottom: 6px; }
    .popup-row { color: #6a9; margin: 2px 0; }
    .popup-row span { color: #ccd; }

    .device-card {
      padding: 10px 12px;
      margin-bottom: 6px;
      border: 1px solid #1e2a3a;
      border-radius: 6px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .device-card:hover { border-color: #2a4060; background: #12121e; }
    .device-card.active { border-color: #4af; background: #0d1a2a; }

    .device-name { font-size: 13px; color: #ccd; margin-bottom: 4px; }
    .device-meta { font-size: 10px; color: #445; line-height: 1.6; }
    .device-meta span { color: #6a9; }

    .battery-bar { height: 3px; background: #1a2030; border-radius: 2px; margin-top: 6px; overflow: hidden; }
    .battery-fill { height: 100%; background: #4af; border-radius: 2px; transition: width 0.5s; }

    /* Trail toggle control */
    .trail-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-top: 1px solid #1a2030;
      font-size: 10px;
      color: #445;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .trail-toggle input[type="checkbox"] {
      accent-color: #4af;
      cursor: pointer;
      width: 12px;
      height: 12px;
    }

    .trail-toggle label {
      cursor: pointer;
      user-select: none;
      color: #556;
      transition: color 0.2s;
    }

    .trail-toggle label:hover { color: #8ab; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1e2a3a; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #2a4060; }

    .loading { font-size: 10px; color: #334; text-align: center; padding: 12px; }
  </style>
</head>
<body>

<header>
  <h1>⬡ GeoTracker</h1>
  <div class="mode-tabs">
    <button class="tab-btn active" onclick="setMode('live')">● En vivo</button>
    <button class="tab-btn" onclick="setMode('history')">◎ Historial</button>
  </div>
  <div id="status">Conectando...</div>
</header>

<div class="main">
  <aside id="sidebar">
    <div class="sidebar-section">Dispositivos</div>
    <div id="device-list"><p class="loading">Sin dispositivos aún.</p></div>

    <!-- Trail toggle (solo en modo live) -->
    <div class="trail-toggle" id="trail-control">
      <input type="checkbox" id="trail-checkbox" checked onchange="toggleTrailVisibility(this.checked)">
      <label for="trail-checkbox">Mostrar traza en vivo</label>
    </div>

    <!-- Panel de historial -->
    <div id="history-panel">
      <div class="sidebar-section">Consultar historial</div>
      <div class="history-form">
        <div>
          <label>Dispositivo</label>
          <select id="hist-device">
            <option value="all">Todos los dispositivos</option>
          </select>
        </div>
        <div>
          <label>Desde</label>
          <input type="datetime-local" id="hist-from">
        </div>
        <div>
          <label>Hasta</label>
          <input type="datetime-local" id="hist-to">
        </div>
        <button class="btn-search" onclick="searchHistory()">Buscar recorrido</button>
        <button class="btn-clear" onclick="clearHistory()">Limpiar mapa</button>
      </div>
      <div id="history-results"></div>
    </div>
  </aside>

  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── Mapa ──────────────────────────────────────────────────────
const map = L.map('map', { zoomControl: false }).setView([-16.409, -71.537], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap',
  maxZoom: 19
}).addTo(map);

L.control.zoom({ position: 'bottomright' }).addTo(map);

// ── Estado ────────────────────────────────────────────────────
const markers = {};
const COLORS = ['#4aaeff', '#4aff8c', '#ff8c4a', '#ff4a8c', '#c44aff', '#ffdd4a'];
let colorIdx = 0;
const deviceColors = {};
let liveInterval = null;
let currentMode = 'live';

// ── Traza en tiempo real ──────────────────────────────────────
const trailPoints = {};  // { device_id: [[lat, lng], ...] }
const trailLines  = {};  // { device_id: L.polyline }
const MAX_TRAIL   = 200; // máximo de puntos por dispositivo en memoria
let trailVisible  = true;

// Capas de historial activas
let historyLayers = [];

function getColor(id) {
  if (!deviceColors[id]) {
    deviceColors[id] = COLORS[colorIdx % COLORS.length];
    colorIdx++;
  }
  return deviceColors[id];
}

function makeIcon(color, size = 28) {
  const s = size, h = Math.round(size * 1.28);
  return L.divIcon({
    className: '',
    html: `<svg width="${s}" height="${h}" viewBox="0 0 28 36" xmlns="http://www.w3.org/2000/svg">
      <path d="M14 0C6.27 0 0 6.27 0 14c0 10.5 14 22 14 22S28 24.5 28 14C28 6.27 21.73 0 14 0z"
            fill="${color}" opacity="0.9"/>
      <circle cx="14" cy="14" r="5" fill="#0a0a0f" opacity="0.8"/>
    </svg>`,
    iconSize: [s, h],
    iconAnchor: [s/2, h],
    popupAnchor: [0, -h]
  });
}

function makeSmallDot(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:8px;height:8px;border-radius:50%;background:${color};border:1.5px solid #0a0a0f;opacity:0.85"></div>`,
    iconSize: [8, 8],
    iconAnchor: [4, 4]
  });
}

function fmtTime(ts) {
  const d = new Date(ts.endsWith('Z') ? ts : ts + 'Z');
  return d.toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function fmtDatetime(ts) {
  const d = new Date(ts.endsWith('Z') ? ts : ts + 'Z');
  return d.toLocaleString('es-PE', {
    day: '2-digit', month: '2-digit', year: '2-digit',
    hour: '2-digit', minute: '2-digit'
  });
}

function fmtCoord(n) { return Number(n).toFixed(6); }

// ── Modo en vivo ───────────────────────────────────────────────
async function refresh() {
  try {
    const res = await fetch('/api/locations/latest');
    const locations = await res.json();

    document.getElementById('status').textContent = `Actualizado ${new Date().toLocaleTimeString('es-PE')}`;
    document.getElementById('status').className = 'live';

    renderSidebar(locations);

    let firstLoad = false;
    locations.forEach(loc => {
      const color = getColor(loc.device_id);
      const popupHTML = buildPopup(loc);

      // ── Traza en tiempo real ──────────────────────────────
      if (!trailPoints[loc.device_id]) trailPoints[loc.device_id] = [];
      const pts = trailPoints[loc.device_id];
      const last = pts[pts.length - 1];

      // Solo agregar si la posición cambió (evita duplicados)
      if (!last || last[0] !== loc.lat || last[1] !== loc.lng) {
        pts.push([loc.lat, loc.lng]);
        if (pts.length > MAX_TRAIL) pts.shift(); // recortar por el inicio
      }

      if (trailLines[loc.device_id]) {
        trailLines[loc.device_id].setLatLngs(pts);
      } else {
        trailLines[loc.device_id] = L.polyline(pts, {
          color,
          weight: 3,
          opacity: 0.7,
          dashArray: '6 4',
        }).addTo(map);
        if (!trailVisible) trailLines[loc.device_id].remove();
      }
      // ─────────────────────────────────────────────────────

      if (markers[loc.device_id]) {
        markers[loc.device_id].setLatLng([loc.lat, loc.lng]).getPopup().setContent(popupHTML);
      } else {
        markers[loc.device_id] = L.marker([loc.lat, loc.lng], { icon: makeIcon(color) })
          .addTo(map).bindPopup(popupHTML);
        firstLoad = true;
      }
    });

    if (firstLoad && locations.length) {
      const lats = locations.map(l => l.lat);
      const lngs = locations.map(l => l.lng);
      if (lats.length === 1) {
        map.setView([lats[0], lngs[0]], 15);
      } else {
        map.fitBounds([[Math.min(...lats), Math.min(...lngs)], [Math.max(...lats), Math.max(...lngs)]], { padding: [60, 60] });
      }
    }

  } catch (e) {
    document.getElementById('status').textContent = 'Sin conexión';
    document.getElementById('status').className = '';
  }
}

function buildPopup(loc) {
  const bat = loc.battery != null ? Math.round(loc.battery * 100) : null;
  return `
    <div class="popup-title">${loc.device_name || loc.device_id}</div>
    <div class="popup-row">Lat: <span>${fmtCoord(loc.lat)}</span></div>
    <div class="popup-row">Lng: <span>${fmtCoord(loc.lng)}</span></div>
    ${loc.accuracy ? `<div class="popup-row">Precisión: <span>${Math.round(loc.accuracy)}m</span></div>` : ''}
    ${bat != null ? `<div class="popup-row">Batería: <span>${bat}%</span></div>` : ''}
    <div class="popup-row">Hora: <span>${fmtTime(loc.timestamp)}</span></div>
  `;
}

// ── Toggle visibilidad de trazas ──────────────────────────────
function toggleTrailVisibility(visible) {
  trailVisible = visible;
  Object.values(trailLines).forEach(line => {
    if (visible) {
      if (!map.hasLayer(line)) line.addTo(map);
    } else {
      if (map.hasLayer(line)) line.remove();
    }
  });
}

// ── Sidebar dispositivos ───────────────────────────────────────
function renderSidebar(locations) {
  const list = document.getElementById('device-list');
  if (!locations.length) {
    list.innerHTML = '<p class="loading">Sin dispositivos aún.</p>';
    return;
  }
  list.innerHTML = locations.map(loc => {
    const color = getColor(loc.device_id);
    const bat = loc.battery != null ? Math.round(loc.battery * 100) : null;
    const pts = trailPoints[loc.device_id];
    const trailCount = pts ? pts.length : 0;
    return `
      <div class="device-card" onclick="flyTo('${loc.device_id}', ${loc.lat}, ${loc.lng})" data-id="${loc.device_id}">
        <div class="device-name" style="color:${color}">◉ ${loc.device_name || loc.device_id}</div>
        <div class="device-meta">
          ${fmtCoord(loc.lat)}, ${fmtCoord(loc.lng)}<br>
          Última señal: <span>${fmtTime(loc.timestamp)}</span>
          ${loc.accuracy ? `<br>Precisión: <span>${Math.round(loc.accuracy)}m</span>` : ''}
          ${trailCount > 1 ? `<br>Traza: <span>${trailCount} puntos</span>` : ''}
        </div>
        ${bat != null ? `<div class="battery-bar"><div class="battery-fill" style="width:${bat}%;background:${bat < 20 ? '#f64' : color}"></div></div>` : ''}
      </div>
    `;
  }).join('');

  updateHistoryDeviceSelect(locations);
}

function flyTo(id, lat, lng) {
  document.querySelectorAll('.device-card').forEach(c => c.classList.remove('active'));
  document.querySelector(`[data-id="${id}"]`)?.classList.add('active');
  map.flyTo([lat, lng], 16, { duration: 1.2 });
  markers[id]?.openPopup();
}

// ── Modo historial ─────────────────────────────────────────────
function updateHistoryDeviceSelect(locations) {
  const sel = document.getElementById('hist-device');
  const current = sel.value;
  const known = Array.from(sel.options).map(o => o.value);
  locations.forEach(loc => {
    if (!known.includes(loc.device_id)) {
      const opt = document.createElement('option');
      opt.value = loc.device_id;
      opt.textContent = loc.device_name || loc.device_id;
      sel.appendChild(opt);
    }
  });
  if (current) sel.value = current;
}

async function searchHistory() {
  const deviceId = document.getElementById('hist-device').value;
  const fromVal = document.getElementById('hist-from').value;
  const toVal = document.getElementById('hist-to').value;

  if (!fromVal || !toVal) {
    alert('Por favor selecciona fecha/hora de inicio y fin.');
    return;
  }

  const from = fromVal.replace('T', ' ');
  const to = toVal.replace('T', ' ');

  document.getElementById('history-results').innerHTML = '<p class="loading">Buscando...</p>';

  clearHistory(false);

  try {
    const url = `/api/locations/history-all?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}&device_id=${deviceId}`;
    const res = await fetch(url);
    const rows = await res.json();

    if (!rows.length) {
      document.getElementById('history-results').innerHTML = '<p class="loading">Sin registros en ese período.</p>';
      return;
    }

    renderHistoryOnMap(rows);
    renderHistoryList(rows);

  } catch (e) {
    document.getElementById('history-results').innerHTML = '<p class="loading">Error al consultar.</p>';
  }
}

function renderHistoryOnMap(rows) {
  const byDevice = {};
  rows.forEach(r => {
    if (!byDevice[r.device_id]) byDevice[r.device_id] = [];
    byDevice[r.device_id].push(r);
  });

  const allLatLngs = [];

  Object.entries(byDevice).forEach(([deviceId, points]) => {
    const color = getColor(deviceId);
    const latLngs = points.map(p => [p.lat, p.lng]);
    allLatLngs.push(...latLngs);

    const poly = L.polyline(latLngs, {
      color: color,
      weight: 3,
      opacity: 0.8,
      dashArray: null
    }).addTo(map);
    historyLayers.push(poly);

    points.forEach((p, i) => {
      if (i === 0 || i === points.length - 1) return;
      const dot = L.marker([p.lat, p.lng], { icon: makeSmallDot(color) })
        .addTo(map)
        .bindPopup(`
          <div class="popup-title">${p.device_name}</div>
          <div class="popup-row">Hora: <span>${fmtDatetime(p.timestamp)}</span></div>
          <div class="popup-row">Lat: <span>${fmtCoord(p.lat)}</span></div>
          <div class="popup-row">Lng: <span>${fmtCoord(p.lng)}</span></div>
        `);
      historyLayers.push(dot);
    });

    if (points.length > 0) {
      const first = points[0];
      const startM = L.marker([first.lat, first.lng], { icon: makeIcon(color, 24) })
        .addTo(map)
        .bindPopup(`<div class="popup-title">Inicio — ${first.device_name}</div><div class="popup-row">Hora: <span>${fmtDatetime(first.timestamp)}</span></div>`);
      historyLayers.push(startM);
    }

    if (points.length > 1) {
      const last = points[points.length - 1];
      const endM = L.marker([last.lat, last.lng], { icon: makeIcon('#ff4a4a', 24) })
        .addTo(map)
        .bindPopup(`<div class="popup-title">Fin — ${last.device_name}</div><div class="popup-row">Hora: <span>${fmtDatetime(last.timestamp)}</span></div>`);
      historyLayers.push(endM);
    }
  });

  if (allLatLngs.length) {
    map.fitBounds(allLatLngs, { padding: [50, 50] });
  }
}

function renderHistoryList(rows) {
  const byDevice = {};
  rows.forEach(r => {
    if (!byDevice[r.device_id]) byDevice[r.device_id] = [];
    byDevice[r.device_id].push(r);
  });

  let html = '';

  Object.entries(byDevice).forEach(([deviceId, points]) => {
    const color = getColor(deviceId);
    const name = points[0].device_name || deviceId;
    const duration = calcDuration(points[0].timestamp, points[points.length - 1].timestamp);

    html += `<div class="history-stat">
      <span style="color:${color}">◉ ${name}</span><br>
      ${points.length} puntos · ${duration}
    </div>`;

    const show = condensedList(points);
    show.forEach(({ point: p, label }) => {
      html += `<div class="history-point" onclick="map.setView([${p.lat},${p.lng}],17)">
        <span class="h-time">${fmtDatetime(p.timestamp)}</span>
        ${label ? `<span style="color:#f64;margin-left:4px">${label}</span>` : ''}
        <br><span class="h-coord">${fmtCoord(p.lat)}, ${fmtCoord(p.lng)}</span>
      </div>`;
    });
  });

  document.getElementById('history-results').innerHTML = html;
}

function condensedList(points) {
  if (points.length <= 6) return points.map(p => ({ point: p, label: '' }));
  return [
    { point: points[0], label: '▲ Inicio' },
    { point: points[Math.floor(points.length * 0.25)], label: '' },
    { point: points[Math.floor(points.length * 0.5)], label: '' },
    { point: points[Math.floor(points.length * 0.75)], label: '' },
    { point: points[points.length - 1], label: '■ Fin' }
  ];
}

function calcDuration(from, to) {
  const diff = new Date(to + 'Z') - new Date(from + 'Z');
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  if (h > 0) return `${h}h ${m}m`;
  return `${m} min`;
}

function clearHistory(resetResults = true) {
  historyLayers.forEach(l => map.removeLayer(l));
  historyLayers = [];
  if (resetResults) {
    document.getElementById('history-results').innerHTML = '';
  }
}

// ── Control de modo ────────────────────────────────────────────
function setMode(mode) {
  currentMode = mode;

  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.tab-btn[onclick="setMode('${mode}')"]`).classList.add('active');

  const histPanel = document.getElementById('history-panel');
  const trailControl = document.getElementById('trail-control');

  if (mode === 'live') {
    histPanel.classList.remove('visible');
    trailControl.style.display = 'flex';
    clearHistory();
    Object.values(markers).forEach(m => map.addLayer(m));
    // Restaurar trazas si estaban visibles
    if (trailVisible) {
      Object.values(trailLines).forEach(l => { if (!map.hasLayer(l)) l.addTo(map); });
    }
    startLive();
  } else {
    histPanel.classList.add('visible');
    trailControl.style.display = 'none';
    // Ocultar trazas en vivo al entrar en modo historial
    Object.values(trailLines).forEach(l => map.removeLayer(l));
    stopLive();

    if (document.getElementById('hist-device').options.length <= 1) {
      fetch('/api/devices').then(r => r.json()).then(devs => {
        const sel = document.getElementById('hist-device');
        devs.forEach(d => {
          const opt = document.createElement('option');
          opt.value = d.id;
          opt.textContent = d.name || d.id;
          sel.appendChild(opt);
        });
      });
    }

    const now = new Date();
    const oneHourAgo = new Date(now - 3600000);
    document.getElementById('hist-to').value = toLocalInputValue(now);
    document.getElementById('hist-from').value = toLocalInputValue(oneHourAgo);
  }
}

function toLocalInputValue(d) {
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function startLive() {
  if (liveInterval) return;
  refresh();
  liveInterval = setInterval(refresh, 5000);
}

function stopLive() {
  if (liveInterval) { clearInterval(liveInterval); liveInterval = null; }
}

// ── Arranque ───────────────────────────────────────────────────
startLive();
</script>
